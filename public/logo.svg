<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 260 150" role="img" aria-label="Towny Water Solutions">
  <title>Towny Water Solutions</title>
  <!-- Translucent glass cube behind the wordmark, as on the office sign -->
  <g stroke="#ffffff" stroke-opacity="0.6" stroke-width="1" stroke-linejoin="round">
    <polygon points="130,3 192,39 130,75 68,39" fill="#dbe5f2" fill-opacity="0.9"/>
    <polygon points="68,39 130,75 130,147 68,111" fill="#a7b9d8" fill-opacity="0.85"/>
    <polygon points="130,75 192,39 192,111 130,147" fill="#7d93c0" fill-opacity="0.85"/>
  </g>
  <g fill="#1d1d24" font-family="Montserrat, 'Century Gothic', Avenir, 'Helvetica Neue', Arial, sans-serif" font-weight="800" text-anchor="middle">
    <text x="130" y="70" font-size="30" textLength="214" lengthAdjust="spacingAndGlyphs">TOWNY WATER</text>
    <text x="130" y="106" font-size="37" textLength="214" lengthAdjust="spacingAndGlyphs">SOLUTIONS</text>
  </g>
</svg>
